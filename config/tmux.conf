# ===== GENERAL SETTINGS =====

# Enable mouse support
set -g mouse on

# Increase scrollback buffer
set -g history-limit 10000

# Keep manually-set window names (don't auto-rename to the running program)
set -g automatic-rename off

# Scroll wheel enters copy-mode instead of sending arrow keys (which would
# cycle shell history at a normal prompt). In fullscreen apps that handle
# the mouse themselves (vim, less, htop, ...), pass the wheel event through.
bind -n WheelUpPane if-shell -F -t = "#{?pane_in_mode,1,#{alternate_on}}" "send-keys -M" "copy-mode -e; send-keys -M"
bind -n WheelDownPane if-shell -F -t = "#{?pane_in_mode,1,#{alternate_on}}" "send-keys -M" "send-keys -M"

# Start window and pane numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Faster escape time (helpful for vim)
set -sg escape-time 0

# Enable clipboard integration
set -g set-clipboard on

# ===== KEY BINDINGS =====

# Pane splitting
bind l split-window -h -c "#{pane_current_path}"
bind h split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Window navigation
bind Left previous-window
bind Right next-window

# Window management
bind n new-window -c "#{pane_current_path}"

# Reload this config without restarting tmux
bind r source-file ~/.tmux.conf \; display-message "tmux.conf reloaded!"

# Kill pane
bind x kill-pane

# Easy config reload
bind R source-file ~/.tmux.conf \; display "Config reloaded!"

# Double-click on window name to rename it
bind-key -n DoubleClick1Status command-prompt -I "#W" "rename-window '%%'"

# ===== COPY MODE =====

# Use vim keybindings in copy mode
setw -g mode-keys vi

# Vim-style copy and paste
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# Auto-copy on mouse selection (drag to select and release to copy)
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection-and-cancel

# Fix word separators to avoid weird spacing when copying
set -g word-separators " @"

# ===== VISUAL CUSTOMIZATION =====

# Enable 256 color support
set -g default-terminal "screen-256color"

# Status bar styling
set -g status-style bg=black,fg=white
set -g status-left-length 60
set -g status-left "#[fg=green]Session: #S  #[fg=yellow]Window: #I  #[fg=cyan]Pane: #P   "
set -g status-right "#[fg=cyan]%d %b %R"
set -g status-interval 60

# Window list: pad each entry and space them apart for readability
set -g window-status-separator "  "
set -g window-status-format " #I: #W#F "
set -g window-status-current-format " #I: #W#F "

# Highlight active window
set -g window-status-current-style bg=blue,fg=white,bold

# Highlight active pane border
set -g pane-active-border-style fg=blue

# Activity monitoring
setw -g monitor-activity on
set -g visual-activity on
